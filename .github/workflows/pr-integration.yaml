---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - 'scripts/testenv.sh'
      - 'scripts/testdata/**'
      - 'acceptance/**'
      - 'integration/**'
      # internal/pandorest's tests re-import the spec and regenerate the SDK,
      # failing when api-definitions/ or lib/prowlarr is stale
      - 'docs/prowlarr-openapi.json'
      - 'api-definitions/**'
      - '.github/workflows/pr-integration.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the unit tests need no server: the tools against a canned one, and the
  # fakes, the helpers and the SDK generation on their own
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - run: make test

  # one job per suite, so a failure names which layer broke: the client's view
  # of the API, or the tools' behaviour on top of it
  integration:
    name: integration (lib/prowlarr against a real Prowlarr)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      # make owns the container lifecycle, so CI runs exactly what a developer
      # runs rather than a second copy of the same steps. The indexers and
      # applications are fakes the suite runs on the host, and the container
      # has no internet, so this needs no network beyond the image.
      - name: Run the SDK suite
        run: make testacc-integration

      - name: Tear down
        if: always()
        run: |
          PROWLARR_TEST_CONTAINER=prowlarr-mcp-integration \
            PROWLARR_TEST_DATA="$HOME/.cache/prowlarr-mcp/testenv/integration" \
            scripts/testenv.sh down || true

  acceptance:
    name: acceptance (tools against a real Prowlarr)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version

      - name: Run the tool suite
        run: make testacc-acceptance

      - name: Tear down
        if: always()
        run: |
          PROWLARR_TEST_CONTAINER=prowlarr-mcp-acceptance \
            PROWLARR_TEST_DATA="$HOME/.cache/prowlarr-mcp/testenv/acceptance" \
            scripts/testenv.sh down || true
